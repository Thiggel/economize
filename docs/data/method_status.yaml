# The reproduction status of every method in economize, rendered on docs/index.md and docs/reproductions.md by
# docs/hooks/method_status.py and copied into README.md (`python docs/hooks/method_status.py --write-readme`).
#
# One entry per method (a registered technique can hold several methods, e.g. quant = RTN, GPTQ, AWQ, ...). Every
# listed technique must appear at least once. Fields:
#   method     the name shown in the table
#   technique  the registered economize technique that implements it
#   paper      arXiv id ("2306.00978") or URL of the paper (or repository) that introduced the method
#   status     reproduced | partial | not-reproduced | not-compared
#   result     economize vs paper on the compared setting ("ours vs paper"); required unless not-compared
#   studies    ids in docs/data/reproductions.yaml that hold the full numbers (optional)
#   note       one short sentence: what differs, or why no comparison exists yet
#
# Verdicts: "reproduced" means within the seed spread or the stated tolerance of every compared paper number (or
# better than the paper where the gap is explained), "partial" means some numbers match and others fall outside it.
schema: 1
methods:
  # Drafting (lossless speculative decoding)
  - method: EAGLE-3 (released drafter)
    technique: eagle3
    paper: "2503.01840"
    status: partial
    result: 2.82× mean speedup, τ 3.73 vs 4.44×, τ 6.1-6.7 (Llama-3.1-8B-Instruct, 5 benchmarks)
    studies: [eagle3-llama-3-1-8b]
    note: economize drafts EAGLE-3 as a chain of 5; the paper's number uses a dynamic draft tree.
