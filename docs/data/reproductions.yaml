  - id: medusa-vicuna-7b
    title: Medusa heads on Vicuna-7B
    technique: medusa
    model: lmsys/vicuna-7b-v1.3 (fp16)
    hardware: NVIDIA A100-SXM4-40GB
    metric: Speedup over plain greedy decoding on Spec-Bench (480 prompts)
    better: higher
    unit: x
    paper:
      source: Spec-Bench leaderboard
      arxiv: "2401.07851"
    economize:
      version: 0.2.0
      date: 2026-10-09
    command: effeval repro run A5
    result: data/results/A5.json
    note: >-
      Uses the released heads FasterDecoding/medusa-vicuna-7b-v1.3 with the tree mc_sim_7b_63, greedy decoding.
      economize decodes 80.3 tokens per second against 53.1 for plain decoding.
    rows:
      - setting: Medusa-1 heads, tree mc_sim_7b_63
        config: economize.load(base, "FasterDecoding/medusa-vicuna-7b-v1.3", decoding=DecodeConfig(cycle_length=5))
        paper: 1.71
        economize: 1.514

  - id: draft-model-vicuna-7b
    title: Speculative decoding of Vicuna-7B with a 68M draft model
    technique: draft_model
    model: lmsys/vicuna-7b-v1.3 (fp16)
    hardware: NVIDIA A100-SXM4-40GB
    metric: Speedup over plain greedy decoding on Spec-Bench (480 prompts)
    better: higher
    unit: x
    paper:
      source: Spec-Bench leaderboard
      arxiv: "2401.07851"
    economize:
      version: 0.2.0
      date: 2026-10-09
    command: effeval repro run A7
    result: data/results/A7.json
    note: >-
      economize drafts a fixed 5 tokens per cycle, while the Spec-Bench entry uses the heuristic draft-length schedule
      of transformers' assisted generation.
    rows:
      - setting: double7/vicuna-68m, 5 draft tokens
        config: DraftModelConfig(model="double7/vicuna-68m"), DecodeConfig(cycle_length=6)
        paper: 1.52
        economize: 1.583

  - id: eagle3-llama-3-1-8b
    title: EAGLE-3 on Llama-3.1-8B-Instruct
    technique: eagle3
    model: meta-llama/Llama-3.1-8B-Instruct (fp16)
    hardware: NVIDIA A100-SXM4-40GB
    metric: Mean speedup over plain greedy decoding on MT-bench, HumanEval, GSM8K, Alpaca and CNN/DM
    better: higher
    unit: x
    paper:
      source: EAGLE-3, Table 1
      arxiv: "2503.01840"
    economize:
      version: 0.2.0
      date: 2026-10-09
    command: effeval repro run A1
    result: data/results/A1.json
    note: >-
      The settings differ: the paper drafts a dynamic tree, economize drafts a chain of 5 tokens with the released
      drafter yuhuili/EAGLE3-LLaMA3.1-Instruct-8B (mean accepted length 3.73). The row is listed for scale and is
      not a like-for-like comparison.
    rows:
      - setting: "Released drafter, chain of 5 (paper: dynamic tree)"
        config: economize.load(base, "yuhuili/EAGLE3-LLaMA3.1-Instruct-8B", decoding=DecodeConfig(cycle_length=6))
        paper: 4.44
        economize: 2.822
