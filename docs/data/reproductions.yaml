# Reproductions of published results with economize, rendered on docs/reproductions.md by
# docs/hooks/reproductions.py. The schema and the steps for adding a study are documented on that page.
#
# Every value here is a measurement. A study lists only the settings for which the paper's number is quoted in the
# documentation. economize was released as effkit before 0.3.0: version 0.2.0 below is effkit 0.2.0.
schema: 1
studies:
  - id: awq-int4-llama-2-7b
    title: 4-bit weight quantization of Llama-2-7B
    technique: quant
    model: meta-llama/Llama-2-7b-hf (fp16)
    hardware: NVIDIA A100-SXM4-40GB (AWQ row NVIDIA RTX A6000)
    metric: WikiText-2 test perplexity, 2048-token windows
    better: lower
    paper:
      source: AWQ, Table 4
      arxiv: "2306.00978"
      baseline: 5.47
    economize:
      version: 0.2.0 (calibration seed 0), 0.3.1 (calibration seeds 1 and 2), 0.5.0 (AWQ row, seeds 0 to 2)
      date: 2026-10-09 (seed 0), 2026-10-12 (seeds 1 and 2), 2026-11-18 (AWQ row)
      baseline: 5.472
    command: effeval repro run B1
    result: data/results/B1.json
    note: >-
      Weights are quantized with the reference numerics (backend "fake"), so the study measures quality, not speed.
      GPTQ calibrates on 128 random C4 sequences of 2048 tokens and AWQ on 128 blocks of 512 tokens from the Pile
      validation set; the three seeds draw different samples.
    rows:
      - setting: RTN, INT4, group size 128
        config: QuantConfig(format="int4", method="rtn", group_size=128, symmetric=False, backend="fake")
        paper: 5.73
        economize: 5.724
      - setting: GPTQ, INT4, group size 128
        config: >-
          QuantConfig(format="int4", method="gptq", group_size=128, symmetric=False, act_order=False,
          true_sequential=True, percdamp=0.01, backend="fake")
        paper: 5.69
        economize: {mean: 5.665, std: 0.045, seeds: 3}
      - setting: AWQ, INT4, group size 128
        config: >-
          QuantConfig(format="int4", method="awq", group_size=128, symmetric=False, awq_grid=20, awq_clip=True,
          backend="fake")
        paper: 5.60
        economize: {mean: 5.606, std: 0.005, seeds: 3}

  - id: awq-int3-llama-2-7b
    title: 3-bit weight quantization of Llama-2-7B
    technique: quant
    model: meta-llama/Llama-2-7b-hf (fp16)
    hardware: NVIDIA A100-SXM4-40GB (AWQ row NVIDIA RTX A6000)
    metric: WikiText-2 test perplexity, 2048-token windows
    better: lower
    paper:
      source: AWQ, Table 4
      arxiv: "2306.00978"
      baseline: 5.47
    economize:
      version: 0.2.0 (calibration seed 0), 0.3.1 (calibration seeds 1 and 2), 0.5.0 (AWQ row, seeds 0 to 2)
      date: 2026-10-09 (seed 0), 2026-10-12 (seeds 1 and 2), 2026-11-18 (AWQ row)
      baseline: 5.472
    command: effeval repro run B2
    result: data/results/B2.json
    note: >-
      Same setup as the 4-bit study. The authors' code (llm-awq) gives 6.25 for AWQ INT3 on the same weights. AWQ
      rounds in the precision of the weights as llm-awq does (fp16 for this model); with float32 rounding economize 0.4
      measured 6.31.
    rows:
      - setting: RTN, INT3, group size 128
        config: QuantConfig(format="int3", method="rtn", group_size=128, symmetric=False, backend="fake")
        paper: 6.66
        economize: 6.661
      - setting: GPTQ, INT3, group size 128
        config: >-
          QuantConfig(format="int3", method="gptq", group_size=128, symmetric=False, act_order=False,
          true_sequential=True, percdamp=0.01, backend="fake")
        paper: 6.43
        economize: {mean: 6.473, std: 0.059, seeds: 3}
      - setting: AWQ, INT3, group size 128
        config: >-
          QuantConfig(format="int3", method="awq", group_size=128, symmetric=False, awq_grid=20, awq_clip=True,
          backend="fake")
        paper: 6.24
        economize: {mean: 6.239, std: 0.011, seeds: 3}

  - id: wanda-llama-7b
    title: Unstructured and 2:4 pruning of LLaMA-7B
    technique: prune
    model: huggyllama/llama-7b (fp16)
    hardware: NVIDIA A100-SXM4-40GB
    metric: WikiText-2 test perplexity, 2048-token windows
    better: lower
    paper:
      source: Wanda, Table 3
      arxiv: "2306.11695"
      baseline: 5.68
    economize:
      version: 0.2.0 (calibration seed 0), 0.3.1 (calibration seeds 1 and 2)
      date: 2026-10-09 (seed 0), 2026-10-12 (seeds 1 and 2)
      baseline: 5.677
    command: effeval repro run B13
    result: data/results/B13.json
    note: >-
      SparseGPT and Wanda calibrate on 128 random C4 sequences of 2048 tokens; magnitude pruning needs no
      calibration data and is run once.
    rows:
      - setting: Magnitude, 50% unstructured
        config: PruneConfig(method="magnitude", sparsity=0.5)
        paper: 17.29
        economize: 17.220
      - setting: SparseGPT, 50% unstructured
        config: PruneConfig(method="sparsegpt", sparsity=0.5)
        paper: 7.22
        economize: {mean: 7.267, std: 0.071, seeds: 3}
      - setting: Wanda, 50% unstructured
        config: PruneConfig(method="wanda", sparsity=0.5)
        paper: 7.26
        economize: {mean: 7.261, std: 0.014, seeds: 3}
      - setting: Magnitude, 2:4
        config: PruneConfig(method="magnitude", sparsity="2:4")
        paper: 42.13
        economize: 42.555
      - setting: SparseGPT, 2:4
        config: PruneConfig(method="sparsegpt", sparsity="2:4")
        paper: 11.00
        economize: {mean: 11.133, std: 0.284, seeds: 3}
      - setting: Wanda, 2:4
        config: PruneConfig(method="wanda", sparsity="2:4")
        paper: 11.53
        economize: {mean: 11.598, std: 0.079, seeds: 3}

  - id: svd-llm-llama-7b
    title: Low-rank compression of LLaMA-7B
    technique: lowrank
    model: huggyllama/llama-7b (fp16)
    hardware: NVIDIA A100-SXM4-80GB
    metric: WikiText-2 test perplexity, 2048-token windows
    better: lower
    paper:
      source: SVD-LLM, Table 1
      arxiv: "2403.07378"
      baseline: 5.68
    economize:
      version: 0.2.0 (calibration seed 0), 0.3.1 (calibration seeds 1 and 2)
      date: 2026-10-09 (seed 0), 2026-10-12 (seeds 1 and 2)
      baseline: 5.581
    command: effeval repro run B19
    result: data/results/B19.json
    note: >-
      Calibration uses 256 sequences of 2048 tokens from the WikiText-2 training split, which favours the WikiText-2
      test perplexity. The dense baseline also differs from the paper's, so the change from dense is the closer
      comparison.
    rows:
      - setting: SVD-LLM, 20% parameter compression
        config: LowRankConfig(method="svd_llm", compression=0.2, sequential=False, offload=True)
        paper: 7.94
        economize: {mean: 7.660, std: 0.035, seeds: 3}

  - id: teal-llama-3-8b
    title: Activation sparsity in Llama-3-8B
    technique: teal
    model: meta-llama/Meta-Llama-3-8B (fp16)
    hardware: NVIDIA A100-SXM4-40GB
    metric: Perplexity of the last 512 tokens of 2048-token windows
    better: lower
    paper:
      source: TEAL, Table 1
      arxiv: "2408.14690"
      baseline: 5.87
    economize:
      version: 0.2.0
      date: 2026-10-10
      baseline: 5.041
    command: effeval repro run B21
    result: data/results/B21.json
    note: >-
      The evaluation text differs from the paper's, so the absolute perplexities differ and the change from dense is
      the quantity to compare. Calibration reads 10 sequences of 2048 tokens from the first rows of the Alpaca dataset in a fixed
      order, so reruns with
      other seeds give identical values.
    rows:
      - setting: 25% sparsity, greedy allocation
        config: TealConfig(sparsity=0.25, allocation="greedy", greedy_step=0.05, prefill="second_half")
        paper: 5.94
        economize: 5.114
      - setting: 40% sparsity, greedy allocation
        config: TealConfig(sparsity=0.4, allocation="greedy", greedy_step=0.05, prefill="second_half")
        paper: 6.21
        economize: 5.324
      - setting: 50% sparsity, greedy allocation
        config: TealConfig(sparsity=0.5, allocation="greedy", greedy_step=0.05, prefill="second_half")
        paper: 6.67
        economize: 5.740

