  - id: awq-int4-llama-7b
    title: 4-bit weight quantization of LLaMA-7B
    technique: quant
    model: huggyllama/llama-7b (fp16)
    hardware: NVIDIA A100-SXM4-40GB
    metric: WikiText-2 test perplexity, 2048-token windows
    better: lower
    paper:
      source: AWQ, Table 4
      arxiv: "2306.00978"
      baseline: 5.68
    economize:
      version: 0.2.0 (calibration seed 0), 0.3.1 (calibration seeds 1 and 2)
      date: 2026-10-09 (seed 0), 2026-10-12 (seeds 1 and 2)
      baseline: 5.677
    command: effeval repro run B3
    result: data/results/B3.json
    note: >-
      Same setup as the Llama-2-7B studies. GPTQ-R is GPTQ with act-order reordering and static groups. GPTQ without
      reordering varies strongly with the calibration draw on this model: calibration seeds 0 to 4 give 6.24 to 6.89,
      and the paper's 6.22 lies just below that range. The AWQ row was measured before economize 0.5.0, when AWQ
      rounded in float32; it now rounds in fp16 as llm-awq does, which lowered AWQ INT3 on Llama-2-7B from 6.31 to
      6.24.
    rows:
      - setting: RTN, INT4, group size 128
        config: QuantConfig(format="int4", method="rtn", group_size=128, symmetric=False, backend="fake")
        paper: 5.96
        economize: 5.964
      - setting: GPTQ, INT4, group size 128
        config: >-
          QuantConfig(format="int4", method="gptq", group_size=128, symmetric=False, act_order=False,
          true_sequential=True, percdamp=0.01, backend="fake")
        paper: 6.22
        economize: {mean: 6.506, std: 0.343, seeds: 3}
      - setting: GPTQ-R, INT4, group size 128
        config: >-
          QuantConfig(format="int4", method="gptq", group_size=128, symmetric=False, act_order=True,
          static_groups=True, true_sequential=True, percdamp=0.01, backend="fake")
        paper: 5.83
        economize: {mean: 5.836, std: 0.019, seeds: 3}
      - setting: AWQ, INT4, group size 128
        config: >-
          QuantConfig(format="int4", method="awq", group_size=128, symmetric=False, awq_grid=20, awq_clip=True,
          backend="fake")
        paper: 5.78
        economize: {mean: 5.809, std: 0.014, seeds: 3}

  - id: gptq-per-channel-llama-7b
    title: Per-channel GPTQ quantization of LLaMA-7B
    technique: quant
    model: huggyllama/llama-7b (fp16)
    hardware: NVIDIA A100-SXM4-40GB
    metric: WikiText-2 test perplexity, 2048-token windows
