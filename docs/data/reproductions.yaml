  - id: torchao-fp8-llama-3-1-8b
    title: FP8 weights and activations in Llama-3.1-8B
    technique: quant
    model: meta-llama/Llama-3.1-8B (bf16)
    hardware: NVIDIA RTX PRO 6000 Blackwell Server Edition
    metric: HellaSwag zero-shot accuracy (%), lm-eval
    better: higher
    paper:
      source: torchao, Table 4
      arxiv: "2507.16099"
      baseline: 60.01
    economize:
      version: 0.2.0
      date: 2026-10-09
      baseline: 60.735
    command: effeval repro run B8
    result: data/results/B8.json
    note: >-
      Weights and activations are cast to fp8 with per-row scales through torchao. WikiText word perplexity rises
      from 7.546 to 7.615 (paper 7.33 to 7.41). The paper measures a 1.26x decoding speedup on an H100 with
      torch.compile; economize runs the same configuration under CUDA graphs without compilation and measures 0.98x.
    rows:
      - setting: FP8 weights and dynamic FP8 activations, per-row scales
        config: QuantConfig(format="fp8", method="rtn", group_size=None, backend="torchao", fp8_activations=True)
        paper: 59.86
        economize: 60.496

