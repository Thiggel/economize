      version: 0.2.0 (calibration seed 0), 0.3.1 (calibration seeds 1 and 2)
      date: 2026-10-09 (seed 0), 2026-10-12 (seeds 1 and 2)
      baseline: 5.677
    command: effeval repro run B4
    result: data/results/B4.json
    note: >-
      Weights are quantized per output channel unless a group size is given, and GPTQ uses act-order and
      true-sequential quantization as in the README. GPTQ calibrates on 128 random C4 sequences of 2048 tokens. INT4
      GPTQ at calibration seeds 0 to 4 gives 6.22, 6.07, 6.13, 6.15 and 6.05.
    rows:
      - setting: RTN, INT4, per channel
        config: QuantConfig(format="int4", method="rtn", group_size=None, symmetric=False, backend="fake")
        paper: 6.29
        economize: 6.290
      - setting: GPTQ, INT4, per channel
        config: >-
          QuantConfig(format="int4", method="gptq", group_size=None, symmetric=False, act_order=True,
          true_sequential=True, percdamp=0.01, backend="fake")
        paper: 6.09
        economize: {mean: 6.137, std: 0.075, seeds: 3}
      - setting: RTN, INT3, per channel
        config: QuantConfig(format="int3", method="rtn", group_size=None, symmetric=False, backend="fake")
        paper: 25.54
        economize: 25.581
      - setting: GPTQ, INT3, per channel
        config: >-
          QuantConfig(format="int3", method="gptq", group_size=None, symmetric=False, act_order=True,
          true_sequential=True, percdamp=0.01, backend="fake")
        paper: 8.07
        economize: {mean: 8.111, std: 0.067, seeds: 3}
      - setting: GPTQ, INT3, group size 128
        config: >-
          QuantConfig(format="int3", method="gptq", group_size=128, symmetric=False, act_order=True,
          static_groups=False, true_sequential=True, percdamp=0.01, backend="fake")
        paper: 6.61
        economize: {mean: 6.508, std: 0.050, seeds: 3}

