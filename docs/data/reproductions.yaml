  - id: wanda-zero-shot-llama-2-7b
    title: Zero-shot accuracy of pruned Llama-2-7B
    technique: prune
    model: meta-llama/Llama-2-7b-hf (fp16)
    hardware: NVIDIA A100-SXM4-80GB
    metric: >-
      Mean zero-shot accuracy (%) over BoolQ, RTE, HellaSwag, WinoGrande, ARC-easy, ARC-challenge and OpenBookQA
      (lm-eval, plain accuracy)
    better: higher
    paper:
      source: Wanda, Table 2
      arxiv: "2306.11695"
      baseline: 59.71
    economize:
      version: 0.2.0 (calibration seed 0), 0.3.1 (calibration seeds 1 and 2)
      date: 2026-10-09 (seed 0), 2026-10-12 (seeds 1 and 2)
      baseline: 60.270
    command: effeval repro run B14
    result: data/results/B14.json
    note: >-
      Calibration as in the WikiText-2 study of this model. The paper used lm-eval commit df3da98c, and the current
      lm-eval scores the dense model 0.56 points higher (BoolQ, RTE and OpenBookQA rise). The authors' code with
      that lm-eval commit on the same weights gives 59.72 for the dense model and 47.47 for magnitude 2:4, so the
      gap of magnitude 2:4 to the paper also appears with the authors' code. RTE has 277 examples and moves the mean
      by up to 1.4 points between settings.
    rows:
      - setting: Magnitude, 50% unstructured
        config: PruneConfig(method="magnitude", sparsity=0.5)
        paper: 51.14
        economize: 51.569
      - setting: SparseGPT, 50% unstructured
