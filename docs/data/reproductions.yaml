        paper: 56.24
        economize: {mean: 56.167, std: 0.131, seeds: 3}
      - setting: Magnitude, 2:4
        config: PruneConfig(method="magnitude", sparsity="2:4")
        paper: 45.58
        economize: 47.455
      - setting: SparseGPT, 2:4
        config: PruneConfig(method="sparsegpt", sparsity="2:4")
        paper: 50.94
        economize: {mean: 50.636, std: 0.777, seeds: 3}
      - setting: Wanda, 2:4
        config: PruneConfig(method="wanda", sparsity="2:4")
        paper: 48.75
        economize: {mean: 48.777, std: 0.036, seeds: 3}

