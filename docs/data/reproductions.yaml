# Reproductions of published results with economize, rendered on docs/reproductions.md by
# docs/hooks/reproductions.py. The schema and the steps for adding a study are documented on that page.
#
# Every value here is a measurement. A study lists only the settings for which the paper's number is quoted in the
# documentation. economize was released as effkit before 0.3.0: version 0.2.0 below is effkit 0.2.0.
schema: 1
studies:
  - id: awq-int4-llama-2-7b
    title: 4-bit weight quantization of Llama-2-7B
    technique: quant
    model: meta-llama/Llama-2-7b-hf (fp16)
    hardware: NVIDIA A100-SXM4-40GB (AWQ row NVIDIA RTX A6000)
    metric: WikiText-2 test perplexity, 2048-token windows
    better: lower
    paper:
      source: AWQ, Table 4
      arxiv: "2306.00978"
      baseline: 5.47
    economize:
      version: 0.2.0 (calibration seed 0), 0.3.1 (calibration seeds 1 and 2), 0.5.0 (AWQ row, seeds 0 to 2)
      date: 2026-10-09 (seed 0), 2026-10-12 (seeds 1 and 2), 2026-11-18 (AWQ row)
      baseline: 5.472
    command: effeval repro run B1
    result: data/results/B1.json
    note: >-
      Weights are quantized with the reference numerics (backend "fake"), so the study measures quality, not speed.
      GPTQ calibrates on 128 random C4 sequences of 2048 tokens and AWQ on 128 blocks of 512 tokens from the Pile
      validation set; the three seeds draw different samples.
    rows:
      - setting: RTN, INT4, group size 128
        config: QuantConfig(format="int4", method="rtn", group_size=128, symmetric=False, backend="fake")
        paper: 5.73
        economize: 5.724
      - setting: GPTQ, INT4, group size 128
        config: >-
          QuantConfig(format="int4", method="gptq", group_size=128, symmetric=False, act_order=False,
          true_sequential=True, percdamp=0.01, backend="fake")
        paper: 5.69
        economize: {mean: 5.665, std: 0.045, seeds: 3}
      - setting: AWQ, INT4, group size 128
        config: >-
          QuantConfig(format="int4", method="awq", group_size=128, symmetric=False, awq_grid=20, awq_clip=True,
          backend="fake")
        paper: 5.60
        economize: {mean: 5.606, std: 0.005, seeds: 3}

