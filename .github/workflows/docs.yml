# Builds the documentation site with MkDocs and publishes it to GitHub Pages (https://thiggel.github.io/economize/).
# Needs Settings > Pages > Source = "GitHub Actions". Runs on every release and on demand.
name: docs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/constraints.txt
      # economize itself is installed: the API reference (mkdocstrings) and the technique table (docs/hooks) import it.
      - run: pip install -c ci/constraints.txt -e ".[docs]"
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
